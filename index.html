function singleLineDiagram(){const nodes=state.sld||[],byId=Object.fromEntries(nodes.map(n=>[n.id,n]));const xs=nodes.map(n=>Number(n.x)||0),ys=nodes.map(n=>Number(n.y)||0);const minX=Math.min(0,...xs)-150,minY=Math.min(0,...ys)-100,maxX=Math.max(900,...xs)+150,maxY=Math.max(520,...ys)+120,vw=maxX-minX,vh=maxY-minY;let grid='<defs><pattern id="sldGrid" width="50" height="50" patternUnits="userSpaceOnUse" patternTransform="translate('+minX+' '+minY+')"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="#334155" stroke-width="1"/></pattern></defs><rect x="'+minX+'" y="'+minY+'" width="'+vw+'" height="'+vh+'" fill="url(#sldGrid)"/>';for(let x=Math.ceil(minX/50)*50;x<=maxX;x+=50)grid+='<text x="'+x+'" y="'+(minY+18)+'" text-anchor="middle" font-size="10" fill="#94a3b8">'+x+'</text>';for(let y=Math.ceil(minY/50)*50;y<=maxY;y+=50)grid+='<text x="'+(minX+10)+'" y="'+(y+4)+'" font-size="10" fill="#94a3b8">'+y+'</text>';const lines=(state.sldConnections||[]).filter(c=>byId[c.from]&&byId[c.to]).map(c=>{let a=byId[c.from],b=byId[c.to];return '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>'}).join("");const shapes=nodes.map(n=>{let bus=String(n.type).toLowerCase().includes("busbar"),tr=String(n.type).toLowerCase().includes("transformer"),w=bus?180:tr?150:130,h=bus?12:tr?48:38,sel=n.id===sldSelectedId;return '<g role="button" tabindex="0" data-sld-id="'+esc(n.id)+'" onpointerdown="gridSldPointerDown(event,\''+esc(n.id)+'\')" onclick="gridSldSelect(\''+esc(n.id)+'\')" onkeydown="if(event.key===\'Enter\')gridSldSelect(\''+esc(n.id)+'\')" style="cursor:grab"><rect x="'+(n.x-w/2)+'" y="'+(n.y-h/2)+'" width="'+w+'" height="'+h+'" rx="'+(bus?4:8)+'" fill="'+(bus?"#164e63":tr?"#78350f":"#172338")+'" stroke="'+(sel?"#f8fafc":bus?"#67e8f9":tr?"#fbbf24":"#64748b")+'" stroke-width="'+(sel?4:2)+'"/><text x="'+n.x+'" y="'+(n.y+4)+'" text-anchor="middle" font-size="11" fill="#e2e8f0" pointer-events="none">'+esc(n.label).slice(0,35)+'</text></g>'}).join("");return '<div class="space-y-4"><section class="panel p-5"><div class="flex flex-wrap justify-between items-start gap-3"><div><h1 class="text-xl font-bold">Single-line diagram</h1><p class="text-xs text-slate-400 mt-1">Drag components to reposition them. Click a component to select it; use Delete selected or Clear all when required.</p><p class="text-xs text-slate-500 mt-1">Drawing canvas expands to fit the component coordinates.</p></div><div class="flex flex-wrap gap-2">'+btn("＋ Add component","gridSldAdd()","primary","plus")+btn("Connect components","gridSldConnect()","muted","git-merge")+btn("Delete selected","gridSldDeleteSelected()","danger","trash-2")+btn("Clear all","gridSldClearAll()","danger","x-circle")+'</div></div><div class="mt-4 overflow-auto rounded-xl border border-slate-800 bg-[#080f1c]" style="resize:both;max-width:100%;height:75vh;min-height:520px"><svg id="sldCanvas" viewBox="'+minX+' '+minY+' '+vw+' '+vh+'" role="img" aria-label="Editable substation single-line diagram with flexible coordinate grid" style="display:block;width:100%;height:100%;min-width:900px;min-height:520px;touch-action:none">'+grid+lines+shapes+'</svg></div><div class="flex flex-wrap gap-3 text-xs text-slate-400 mt-3"><span>Canvas: '+vw+' × '+vh+' units</span><span>Components: '+nodes.length+'</span><span>Selected: '+esc(nodes.find(n=>n.id===sldSelectedId)?.label||"none")+'</span></div><p class="text-[11px] text-amber-200/80 mt-3">Illustrative diagram only; confirm topology against approved drawings. This is not a live SCADA or switching diagram.</p></section><section class="panel overflow-hidden"><div class="p-4 flex justify-between gap-3"><h2 class="font-bold">Diagram components</h2><span class="text-xs text-slate-500">'+nodes.length+' components</span></div><div class="table-scroll overflow-x-auto"><table><thead><tr><th>ID</th><th>Label</th><th>Type</th><th>Position</th><th>Actions</th></tr></thead><tbody>'+nodes.map(n=>'<tr><td>'+esc(n.id)+'< v><div class="text-[10px] text-slate-500 mt-1">'+esc(state.session.substationId)+'</div></div><div class="text-[10px] uppercase tracking-widest text-slate-600 px-3">Workspace</div><nav id="nav" class="space-y-1">'+nav.map(n=>'<button class="navbtn '+(tab===n[0]?"active":"")+'" onclick="gridTab(\''+n[0]+'\')">'+ic(n[2])+' '+n[1]+'</button>').join("")+'</nav><div class="mt-auto hidden md:block text-[10px] text-slate-600 leading-relaxed">Operational data register. Follow approved protection and safety procedures.</div></aside><div id="main" class="flex-1 md:ml-[250px] min-w-0"><header class="sticky top-0 z-10 border-b border-slate-800 bg-[#080d18]/90 backdrop-blur px-4 md:px-7 py-3 flex flex-wrap justify-between items-center gap-3"><div><b>'+esc((nav.find(n=>n[0]===tab)||nav[0])[1])+'</b><div class="text-[10px] text-slate-500 mt-1">'+esc(state.session.operatorName)+' · '+esc(time())+'</div></div><div class="flex flex-wrap gap-2 items-center">'+status()+btn("Switch substation","gridChooseSubstation()","muted","repeat")+btn("Manage substations","gridManageSubstations()","muted","building-2")+btn("Cloud setup","gridModal(\'dbconfig\')","muted","database")+btn("Sign out","gridLogout()","muted","log-out")+'</div></header><main class="p-4 md:p-7 max-w-[1600px] mx-auto">'+(msg?'<div class="rounded-xl border border-sky-400/20 bg-sky-400/5 p-3 text-sm mb-4">'+esc(msg)+'</div>':"")+body+'</main><footer class="px-5 pb-6 text-[10px] text-slate-600 flex justify-between flex-wrap gap-2"><span>SubstationOps · 33/11 kV distribution substation</span><span>Indian Standard Time (IST)</span></footer>'+modalHTML()+'</div></div>';lucide.createIcons()}
async function connect(){if(stopSnap){stopSnap();stopSnap=null}if(appFB){try{if(auth)await signOut(auth)}catch{}try{await deleteApp(appFB)}catch{}}db=auth=appFB=null;if(!cfg.apiKey||!cfg.projectId){dbStatus="local";render();return}try{dbStatus="connecting";appFB=initializeApp(cfg,"gridops-"+Date.now());auth=getAuth(appFB);db=getFirestore(appFB);onAuthStateChanged(auth,async u=>{user=u;if(u){dbStatus="local";substationSelected=false;if(stopSnap){stopSnap();stopSnap=null}}else{if(stopSnap){stopSnap();stopSnap=null}substationSelected=false;dbStatus="local"}render()})}catch(e){dbStatus="error";dbError=e.message;render()}}
async function persist(){saveLocal();if(!db||!user){render();return}try{await setDoc(doc(db,"gridops_substations",state.session.substationId),{substationName:state.session.substationName,ptrCount:state.ptrs.length,lastUpdatedBy:user.email||user.uid,lastUpdatedIst:time(),customColumns:state.customColumns,ptrs:state.ptrs,relays:state.relays,faults:state.faults,feeders:state.feeders,issues:state.issues,sld:state.sld,sldConnections:state.sldConnections,auditLog:state.auditLog},{merge:true});dbStatus="connected";dbError=""}catch(e){dbStatus="error";dbError=e.message;msg="Cloud save failed: "+e.message}render()}

window.gridUsersLoad=async()=>{if(!db||!user){msg="Sign in to Firebase before viewing user records.";render();return}try{const snap=await getDocs(collection(db,"gridops_users"));userRecords=snap.docs.map(d=>Object.assign({id:d.id},d.data()));userRecordsLoaded=true;msg="Loaded "+userRecords.length+" user records."}catch(e){msg="Could not load user records: "+e.message}render()};
window.gridUserAdd=async()=>{if(!db||!user){msg="Sign in to Firebase before editing user records.";render();return}const name=prompt("Full name");if(name===null||!name.trim())return;const email=prompt("Email");if(email===null||!email.trim())return;const role=prompt("Role","Operator");if(role===null)return;const substationId=prompt("Substation ID (optional)","");if(substationId===null)return;const id=prompt("Unique record ID",email.trim().toLowerCase().replace(/[^a-z0-9_-]+/g,"_"));if(!id||!/^[A-Za-z0-9_-]+$/.test(id))return alert("Invalid record ID.");try{await setDoc(doc(db,"gridops_users",id),{name:name.trim(),email:email.trim(),role:role.trim()||"Operator",substationId:substationId.trim(),active:true,updatedAtIst:time(),updatedBy:user.email||user.uid});await gridUsersLoad()}catch(e){msg="Save failed: "+e.message;render()}};
window.gridUserEditPrompt=()=>{const id=prompt("Enter profile record ID to edit");if(id)gridUserEdit(id)};
window.gridUserDeletePrompt=()=>{const id=prompt("Enter profile record ID to delete");if(id)gridUserDelete(id)};
window.gridUserEdit=async id=>{const x=userRecords.find(a=>a.id===id);if(!x||!db||!user)return;const name=prompt("Full name",x.name||"");if(name===null)return;const email=prompt("Email",x.email||"");if(email===null)return;const role=prompt("Role",x.role||"Operator");if(role===null)return;const substationId=prompt("Substation ID",x.substationId||"");if(substationId===null)return;const active=prompt("Status: active or inactive",x.active===false?"inactive":"active");if(active===null)return;try{await setDoc(doc(db,"gridops_users",id),{...x,name:name.trim(),email:email.trim(),role:role.trim(),substationId:substationId.trim(),active:active.trim().toLowerCase()!=="inactive",updatedAtIst:time(),updatedBy:user.email||user.uid});await gridUsersLoad()}catch(e){msg="Update failed: "+e.message;render()}};
window.gridUserDelete=async id=>{const x=userRecords.find(a=>a.id===id);if(!x||!db||!user||!confirm("Delete profile record "+(x.name||x.email||id)+"? This does not delete the Firebase Authentication account."))return;try{await deleteDoc(doc(db,"gridops_users",id));await gridUsersLoad()}catch(e){msg="Delete failed: "+e.message;render()}};

window.gridQuickNote=()=>{const title=prompt("Field observation / issue title");if(!title||!title.trim())return;const category=prompt("Category: Equipment, Protection / Relay, Safety, Maintenance, Other","Equipment");if(category===null)return;const priority=prompt("Priority: Low, Medium, High, Critical","Medium");if(priority===null)return;const description=prompt("Observation, location and action required","");if(description===null)return;state.issues.unshift({id:"ISS-"+Date.now().toString(36).toUpperCase(),title:title.trim(),category:category.trim(),priority:priority.trim(),reportedBy:state.session.operatorName||"Field operator",description:description.trim(),status:"Open",resolutionNotes:"",createdAt:time(),updatedAt:time(),resolvedAt:""});recordAudit("CREATE","field issue",title.trim());msg="Field note saved.";persist()};

window.gridSldPointerDown=(e,id)=>{if(e.button!==0)return;e.preventDefault();e.stopPropagation();sldSelectedId=id;sldDrag={id,startClientX:e.clientX,startClientY:e.clientY,moved:false};const svg=document.getElementById("sldCanvas");if(svg){const move=ev=>{if(!sldDrag)return;const rect=svg.getBoundingClientRect(),vb=svg.viewBox.baseVal,scaleX=vb.width/rect.width,scaleY=vb.height/rect.height;const dx=(ev.clientX-sldDrag.startClientX)*scaleX,dy=(ev.clientY-sldDrag.startClientY)*scaleY;if(Math.abs(dx)+Math.abs(dy)>2)sldDrag.moved=true;const n=state.sld.find(x=>x.id===sldDrag.id);if(n){n.x=Math.round((n.x+dx)/50)*50;n.y=Math.round((n.y+dy)/50)*50;sldDrag.startClientX=ev.clientX;sldDrag.startClientY=ev.clientY;render();}};const up=()=>{if(sldDrag&&sldDrag.moved){recordAudit("UPDATE","single-line diagram",sldDrag.id+" dragged");msg="Component repositioned.";persist()}sldDrag=null;window.removeEventListener("pointermove",move);window.removeEventListener("pointerup",up)};window.addEventListener("pointermove",move);window.addEventListener("pointerup",up,{once:true})}};
window.gridSldDeleteSelected=()=>{if(!sldSelectedId){msg="Select a component first.";render();return}gridSldDelete(sldSelectedId)};
window.gridSldClearAll=async()=>{if(!(state.sld||[]).length){msg="Diagram is already empty.";render();return}if(!confirm("Clear all diagram components and connections for this substation? This cannot be undone unless you have a backup."))return;const count=state.sld.length;state.sld=[];state.sldConnections=[];sldSelectedId=null;recordAudit("DELETE","single-line diagram","Cleared all "+count+" components and connections");msg="All diagram components and connections cleared.";await persist()};
window.gridSldSaveForm=e=>{e.preventDefault();const f=e.target,id=f.elements.id.value.trim(),label=f.elements.label.value.trim(),type=f.elements.type.value,x=Number(f.elements.x.value),y=Number(f.elements.y.value);if(!label||!id)return;const editing=modal==="sld-edit",old=editing?state.sld.find(n=>n.id===editingId):null;if(editing&&!old)return;if(!editing&&state.sld.some(n=>n.id===id)){alert("That component ID already exists.");return}if(![50,100,150,200,250,300,350,400,450,500,550,600,650,700,750,800,850].includes(x)||![50,100,150,200,250,300,350,400,450,500].includes(y)){alert("Choose coordinates on the grid.");return}if(editing){Object.assign(old,{label,type,x,y});recordAudit("UPDATE","single-line diagram",id+" edited")}else{state.sld.push({id,label,type,x,y});recordAudit("CREATE","single-line diagram",id+" · "+label)}modal="";editingId=null;msg=editing?"Component updated.":"Component added.";persist()};

window.gridManageSubstations=async()=>{
 let action=prompt("Manage substations: ADD, EDIT, DELETE, or CANCEL","ADD");
 if(!action||action.toUpperCase()==="CANCEL")return;
 action=action.toUpperCase();
 if(action==="ADD"){
  let name=prompt("New substation name");if(!name||!name.trim())return;
  let suggested=name.trim().toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");
  let id=prompt("Firestore document ID (letters, numbers, underscore, hyphen)",suggested);
  if(!id||!/^[A-Za-z0-9_-]+$/.test(id))return alert("Invalid document ID.");
  if(substations.some(x=>x.id===id))return alert("That document ID already exists.");
  substations.push({id,name:name.trim()});saveSubstations();msg="Substation added to this browser list.";render();return;
 }
 alert("Saved substations:\n"+substations.map((x,i)=>(i+1)+". "+x.name+" ["+x.id+"]").join("\n"));
 let choice=Number(prompt("Enter substation number to "+(action==="EDIT"?"edit":action==="DELETE"?"delete":"manage")));
 if(!Number.isInteger(choice)||choice<1||choice>substations.length)return;
 let x=substations[choice-1];
 if(action==="EDIT"){
  let name=prompt("Substation name",x.name);if(!name||!name.trim())return;
  let id=prompt("Document ID",x.id);if(!id||!/^[A-Za-z0-9_-]+$/.test(id))return alert("Invalid document ID.");
  if(id!==x.id&&substations.some(a=>a.id===id))return alert("That document ID already exists.");
  let oldId=x.id;x.name=name.trim();x.id=id;
  if(state.session.substationId===oldId){state.session.substationId=id;state.session.substationName=x.name;saveLocal()}
  saveSubstations();msg="Substation details updated. Changing a document ID does not move existing cloud records.";render();return;
 }
 if(action==="DELETE"){
  if(substations.length===1)return alert("At least one substation must remain in the list.");
  if(!confirm("Delete "+x.name+"? This attempts to delete its Firestore document and all operational records if your security rules permit it."))return;
  try{
   if(db&&user)await deleteDoc(doc(db,"gridops_substations",x.id));
   substations=substations.filter(a=>a.id!==x.id);saveSubstations();
   if(state.session.substationId===x.id){state.session.substationId=substations[0].id;state.session.substationName=substations[0].name;state.ptrs=[];state.relays=[];state.faults=[];state.feeders=[];state.issues=[];state.customColumns={ptrs:[],relays:[],faults:[],feeders:[]};saveLocal();substationSelected=false}
   msg="Substation removed from this browser list"+(db&&user?"; cloud document deleted.":"; cloud data was not deleted because Firebase is not connected.");render();
  }catch(e){msg="Cloud deletion failed (possibly blocked by Firestore rules): "+e.message;render()}
  return;
 }
 alert("Choose ADD, EDIT, DELETE, or CANCEL.");
};
window.gridSwitchSubstation=async id=>{
 let x=substations.find(a=>a.id===id);if(!x)return;
 if(stopSnap){stopSnap();stopSnap=null}

 state.ptrs=[];state.relays=[];state.faults=[];state.feeders=[];state.customColumns={ptrs:[],relays:[],faults:[],feeders:[]};saveLocal();
 modal="";tab="dashboard";filter="";msg="";substationSelected=true;
 if(user&&db){
  dbStatus="connecting";
  stopSnap=onSnapshot(doc(db,"gridops_substations",id),snap=>{
   dbStatus="connected";dbError="";
   if(snap.exists()){
    let c=snap.data();state.ptrs=Array.isArray(c.ptrs)?c.ptrs:[];state.relays=Array.isArray(c.relays)?c.relays:[];state.faults=Array.isArray(c.faults)?c.faults:[];state.feeders=Array.isArray(c.feeders)?c.feeders:[];state.issues=Array.isArray(c.issues)?c.issues:[];state.sld=Array.isArray(c.sld)?c.sld:state.sld;state.sldConnections=Array.isArray(c.sldConnections)?c.sldConnections:state.sldConnections;state.auditLog=Array.isArray(c.auditLog)?c.auditLog:state.auditLog;state.customColumns=Object.assign({ptrs:[],relays:[],faults:[],feeders:[]},c.customColumns||{});state.session.substationName=c.substationName||x.name;saveLocal();
   }else msg="No cloud data exists for this substation yet. Add a record to initialize it.";
   render();
  },e=>{dbStatus="error";dbError=e.message;msg="Unable to access this substation: "+e.message;render()});
 }
 render();

window.gridAdd=async(e,m)=>{if(e){e.preventDefault();e.stopPropagation()}try{const f=e&&e.target&&e.target.tagName==="FORM"?e.target:(e&&e.currentTarget&&e.currentTarget.tagName==="FORM"?e.currentTarget:null);if(!f)throw Error("Could not read the record form. Close the dialog and try again.");const fd=new FormData(f),editing=modal==="edit:"+m,existing=editing?(state[m]||[]).find(x=>x.id===editingId):null,r=existing?{...existing}:{id:m.slice(0,3).toUpperCase()+"-"+Date.now().toString(36).toUpperCase(),timestamp:time()};if(!defs[m]||!Array.isArray(state[m]))throw Error("Unknown register: "+m);for(const a of defs[m].fields){const raw=fd.get(a[0]);if(raw===null)throw Error("Form field missing: "+a[1]);const v=String(raw).trim();if(!v)throw Error("Enter "+a[1]+".");r[a[0]]=a[2]==="number"?Number(v):v;if(a[2]==="number"&&!Number.isFinite(r[a[0]]))throw Error("Enter a valid number for "+a[1]+".")}for(const c of state.customColumns[m]||[]){const raw=fd.get(c.key);r[c.key]=String(raw??"").trim()}if(existing){state[m]=state[m].map(x=>x.id===editingId?r:x);recordAudit("UPDATE",m,r.id+" updated");msg="Record updated."}else{state[m].unshift(r);recordAudit("CREATE",m,r.id+" created");msg="Record saved."}modal="";editingId=null;await persist()}catch(err){console.error("Record save failed",err);msg="Record not saved: "+(err&&err.message?err.message:String(err));render()}return false};
